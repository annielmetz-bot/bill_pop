[project]
name = "bill-pop"
version = "0.1.0"
description = "Billing automation agent for psychedelic-assisted therapy (PAT) clinics"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
