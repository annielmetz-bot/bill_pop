[project]
name = "bill-pop"
version = "0.1.0"
description = "Billing automation agent for psychedelic-assisted therapy (PAT) clinics"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic autogenerates migration files that don't conform to our line-length
# or import-order rules; linting generated code is noise.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom relies on calls in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
